<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamache Apps - Trucking Training</title>
<style>
body{background:#0d0f14;color:#eef1f7;font-family:system-ui,sans-serif;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.card{background:#1a1f2b;border:1px solid #2a3142;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:28px}
.btn{padding:8px 14px;border-radius:10px;border:1px solid #2a3142;background:#151923;color:#eef1f7;font-weight:700;cursor:pointer;display:inline-flex;text-decoration:none;align-items:center;gap:6px}
.btn.primary{background:#ffb627;color:#111;border-color:#ffb627} .btn.buy{background:#3ddc97;color:#06281a;border-color:#3ddc97}
.cat-bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.cat-chip{padding:6px 14px;border-radius:99px;border:1px solid #2a3142;background:#1a1f2b;color:#9aa3b5;cursor:pointer;font-weight:600;font-size:.85rem}
.cat-chip.active{background:#ffb627;color:#111}
.search-box{display:flex;gap:8px;margin:12px 0}
.search-box input{flex:1;min-width:200px;background:#1a1f2b;border:1px solid #2a3142;color:#eef1f7;border-radius:10px;padding:10px 14px}
.badge{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:.7rem;font-weight:700;background:#ffb62722;color:#ffb627;border:1px solid #ffb62744;text-transform:uppercase}
.demo-modal{position:fixed;inset:0;z-index:100;display:none} .demo-modal.show{display:block} .d-back{position:absolute;inset:0;background:rgba(0,0,0,.85)} .d-box{position:relative;max-width:1100px;margin:3vh auto;background:#0d0f14;border:1px solid #2a3142;border-radius:16px;height:94vh;display:flex;flex-direction:column} .d-head{display:flex;justify-content:space-between;padding:12px 16px;background:#151923;border-bottom:1px solid #2a3142} .timer{background:#ffb627;color:#111;padding:4px 12px;border-radius:99px;font-weight:700} iframe{flex:1;border:0;background:#000} .paywall{position:absolute;inset:56px 0 0;background:rgba(13,15,20,.97);display:none;place-items:center;padding:24px;text-align:center} .paywall.show{display:grid} .paywall-card{background:#151923;border:1px solid #2a3142;border-radius:16px;padding:28px;max-width:440px}
.site-foot{text-align:center;padding:30px 16px 20px;color:#4b5263;font-size:.8rem}
</style></head><body>
<div class="wrap" style="padding:24px 16px"><div><h1 style="font-size:2.1rem;margin:0">Gamache Apps</h1><p style="color:#9aa3b5;margin:6px 0 0">Trucking Training Only — Demo (1 min) + Buy Only — START HERE for Class 1 Training</p></div><div class="search-box"><input id="searchInput" placeholder="Search apps..." oninput="renderGrid()"><span id="resultCount" style="color:#9aa3b5;font-size:.85rem"></span></div><div id="catBar" class="cat-bar"></div><div class="grid" id="grid"></div></div><footer class="site-foot">© Gamache Apps — For educational / training use.</footer><div class="demo-modal" id="demoModal"><div class="d-back" onclick="closeDemo()"></div><div class="d-box"><div class="d-head"><strong id="dTitle">Demo</strong><div style="display:flex;gap:10px;align-items:center"><span class="timer" id="dTimer">01:00</span><button class="btn" onclick="closeDemo()">✕</button></div></div><iframe id="dFrame" src="about:blank"></iframe><div class="paywall" id="dPaywall"><div class="paywall-card"><div style="font-size:48px">⏱</div><h3>Demo Over - 1 Minute</h3><p style="color:#9aa3b5;margin:12px 0">Buy full version for unlimited.</p><a id="dBuyLink" class="btn buy" target="_blank" href="#">Buy Full Version</a><button class="btn" onclick="replayDemo()" style="margin-left:8px">Replay Demo</button></div></div></div></div><script>
const defaultApps = [
  {"id": "semi", "title": "Semi Shifting", "desc": "Teaches shift at the proper rpm, make sure you check what keys to use and practice using them. For educational use.. For educational use.", "icon": "\ud83c\udfae", "play": "https://gamache61.github.io/MySemiShiftingApp/", "buy": "https://buy.stripe.com/6oUdR9fHZdHw7389mFbZe0N", "price": "4.89", "color": "#ffb627", "category": "trucking"},
  {"id": "backup", "title": "Backup Semi Trailer", "desc": "Teach yourself how to backup a semi trailer in the cab of a simulator. For educational use.", "icon": "\ud83d\ude9b", "play": "https://gamache61.github.io/MyBackupSemiTrailerApp/", "buy": "https://buy.stripe.com/8x23cvcvNavk2MS2YhbZe0M", "price": "4.89", "color": "#ffb627", "category": "trucking"},
  {"id": "airbrake", "title": "Air Brake Trainer", "desc": "Practice air brake checks. For educational use", "icon": "\ud83d\udede", "play": "https://gamache61.github.io/MyAirBrakeTrainingApp/", "buy": "https://buy.stripe.com/7sY00j7bt5b09bgfL3bZe0L", "price": "4.89", "color": "#ffb627", "category": "trucking"},
  {"id": "pretrip", "title": "Pre-Trip Walkaround", "desc": "Walk around 3D tractor-trailer. For educational use.", "icon": "\ud83d\udd0d", "play": "https://gamache61.github.io/MyPretripWalkAroundApp/", "buy": "https://buy.stripe.com/aFa00j1R90UK73842lbZe0K", "price": "Free", "color": "#3ddc97", "category": "trucking"},
  {"id": "chainup", "title": "Chain-Up Trainer", "desc": "Learn which tires to chainup on different trucks. For educational use.", "icon": "\u26d3", "play": "https://gamache61.github.io/MySemiChainupApp/", "buy": "https://buy.stripe.com/00w5kDdzR0UKcnscyRbZe0J", "price": "4.89", "color": "#9aa3b5", "category": "trucking"},
  {"id": "winter", "title": "Winter Driving Trainer", "desc": "Practice snow and ice decisions. For educational use.", "icon": "\u2744", "play": "https://gamache61.github.io/MySemiWinterDrivingApp/", "buy": "https://buy.stripe.com/aFabJ1anF0UK9bgfL3bZe0I", "price": "4.89", "color": "#7fd6ff", "category": "trucking"},
  {"id": "dg", "title": "DG Paperwork Checker", "desc": "Check dangerous goods docs. For educational use.", "icon": "\u2623", "play": "https://gamache61.github.io/MyDGCheckerApp/", "buy": "https://buy.stripe.com/6oU3cvcvNgTI9bgbuNbZe0H", "price": "4.89", "color": "#ffd23f", "category": "trucking"},
  {"id": "coupling", "title": "Coupling & Uncoupling Trainer", "desc": "Hook-up sequence. For educational use.", "icon": "\ud83d\udd17", "play": "https://gamache61.github.io/MySemiCouplingApp/", "buy": "https://buy.stripe.com/aFa7sL1R946W5Z4buNbZe0G", "price": "Free", "color": "#c792ea", "category": "trucking"},
  {"id": "brakeadj", "title": "Brake Adjustment Trainer", "desc": "Measure pushrod stroke. For educational use.", "icon": "\ud83d\udd27", "play": "https://gamache61.github.io/MyBrakeAdjusmentApp/", "buy": "https://buy.stripe.com/6oUfZheDV32S5Z4dCVbZe0F", "price": "4.89", "color": "#ff8a65", "category": "trucking"},
  {"id": "app_1793154127235", "title": "Axle Weights", "desc": "Check the axle weight of different combination of truck and trailer. For educational use.", "icon": "\ud83c\udd95", "play": "https://gamache61.github.io/MyAxleWeightsApp/", "buy": "https://buy.stripe.com/aFabJ1brJeLA9bggP7bZe0C", "price": "Free", "color": "#ffb627", "category": "trucking"},
  {"id": "app_1793154312156", "title": "Class 1 Training", "desc": "This app is a all in one app of the different training that you have to go through to get your class1 and more. For educational use.", "icon": "\ud83c\udd95", "play": "https://gamache61.github.io/MyClass1TrainingApp", "buy": "https://buy.stripe.com/dRmcN5anF5b0evA6atbZe0D", "price": "4.89", "color": "#ffb627", "category": "trucking"},
  {"id": "hos", "title": "Hours of Service Trainer", "desc": "Learn Canadian Hours of Service the easy way. The Hours of Service Trainer is a practice app for truck drivers and Class 1 students, based on the federal rules (south of 60). For educational use.", "icon": "\u23f1", "play": "https://gamache61.github.io/MyHoursOfServiceApp/", "buy": "https://buy.stripe.com/aFa28rfHZfPE5Z47exbZe0O", "price": "4.89", "color": "#ffb627", "category": "trucking"}
];

let apps = JSON.parse(JSON.stringify(defaultApps));
let activeCategory='all';
function setCategory(c){ activeCategory=c; renderCatBar(); renderGrid(); }
function renderCatBar(){ const all=[...new Set(apps.map(a=>(a.category||'trucking').toLowerCase()))].sort(); const counts={}; apps.forEach(a=>{ const c=(a.category||'').toLowerCase(); counts[c]=(counts[c]||0)+1; }); document.getElementById('catBar').innerHTML = '<button class="cat-chip '+(activeCategory==='all'?'active':'')+'" onclick="setCategory(\'all\')">All ('+apps.length+')</button>' + all.map(c=>'<button class="cat-chip '+(activeCategory===c?'active':'')+'" onclick="setCategory(\''+c+'\')">'+c+' ('+(counts[c]||0)+')</button>').join(''); }
function renderGrid(){ const q=(document.getElementById('searchInput').value||'').toLowerCase().trim(); let filtered=apps.filter(a=>{ const cat=(a.category||'').toLowerCase(); const matchCat=activeCategory==='all'||cat===activeCategory; const hay=(a.title+' '+a.desc+' '+a.category).toLowerCase(); return matchCat && (!q||hay.includes(q)); }); document.getElementById('grid').innerHTML=filtered.map(a=>{ let btn=''; if(/^\s*\$?\s*free\s*$/i.test(a.price||'')){ btn='<a class="btn buy" href="'+a.play+'" target="_blank">Open App - Free</a>'; } else { btn='<button class="btn primary" data-demo="'+a.play+'" data-buy="'+a.buy+'" data-title="'+a.title+'">Demo (1 min)</button>'+(a.buy?'<a class="btn buy" href="'+a.buy+'" target="_blank">Buy - $'+a.price+'</a>':''); } return '<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="icon" style="background:'+a.color+'22">'+a.icon+'</div><div><h3 style="margin:0">'+a.title+'</h3><div style="margin-top:4px"><span class="badge">'+a.category+'</span></div></div></div><p style="color:#9aa3b5;font-size:.9rem;margin:4px 0">'+a.desc+'</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto">'+btn+'</div></div>'; }).join('')||'<div style="grid-column:1/-1;text-align:center;color:#9aa3b5;padding:40px">No apps found</div>'; document.getElementById('resultCount').textContent=filtered.length+' of '+apps.length+' apps'; }
let _t=null;
function openDemo(url,buyUrl,title){ const m=document.getElementById('demoModal'); const fr=document.getElementById('dFrame'); const pay=document.getElementById('dPaywall'); document.getElementById('dTitle').textContent=title+' - 1 min Demo'; const b=document.getElementById('dBuyLink'); b.href=buyUrl||'#'; b.style.display=buyUrl?'inline-flex':'none'; fr.src=url; pay.classList.remove('show'); m.classList.add('show'); document.body.style.overflow='hidden'; let left=60; const t=document.getElementById('dTimer'); t.textContent='01:00'; clearInterval(_t); _t=setInterval(()=>{ left--; const mm=String(Math.floor(left/60)).padStart(2,'0'); const ss=String(left%60).padStart(2,'0'); t.textContent=mm+':'+ss; if(left<=0){ clearInterval(_t); pay.classList.add('show'); } },1000); }
function closeDemo(){ clearInterval(_t); document.getElementById('demoModal').classList.remove('show'); document.getElementById('dFrame').src='about:blank'; document.body.style.overflow=''; }
function replayDemo(){ document.getElementById('dPaywall').classList.remove('show'); const f=document.getElementById('dFrame'); f.src=f.src; let left=60; const t=document.getElementById('dTimer'); t.textContent='01:00'; clearInterval(_t); _t=setInterval(()=>{ left--; const mm=String(Math.floor(left/60)).padStart(2,'0'); const ss=String(left%60).padStart(2,'0'); t.textContent=mm+':'+ss; if(left<=0){ clearInterval(_t); document.getElementById('dPaywall').classList.add('show'); } },1000); }
document.addEventListener('click', e=>{ const b=e.target.closest('[data-demo]'); if(b) openDemo(b.getAttribute('data-demo'), b.getAttribute('data-buy'), b.getAttribute('data-title')); });
renderCatBar(); renderGrid();
</script></body></html>
